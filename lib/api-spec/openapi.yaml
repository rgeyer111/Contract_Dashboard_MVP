openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contracts
    description: Contract extraction and persistence operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contracts/extract:
    post:
      operationId: extractContract
      tags: [contracts]
      summary: Extract a contract review draft from a PDF
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ContractExtractionUpload"
      responses:
        "200":
          description: Extracted contract review draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractExtractionResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unreadable PDF or extracted text exceeds the safe review limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Extraction service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List saved contracts
      responses:
        "200":
          description: Saved contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedContract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Save a confirmed contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractSaveRequest"
      responses:
        "201":
          description: Saved contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "400":
          description: Invalid contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getContract
      tags: [contracts]
      summary: Get a saved contract
      responses:
        "200":
          description: Saved contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateContract
      tags: [contracts]
      summary: Update a saved contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractSaveRequest"
      responses:
        "200":
          description: Updated contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "400":
          description: Invalid contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ContractExtractionUpload:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: A PDF contract up to 10 MB.
    ProvenanceMetadata:
      type: object
      required: [status, confidence, page, clause, quote, note]
      properties:
        status:
          type: string
          enum: [found, not_found, ambiguous, conflicting]
        confidence:
          type: string
          enum: [high, medium, low]
        page:
          type: ["number", "null"]
          minimum: 1
          multipleOf: 1
        clause:
          type: ["string", "null"]
          maxLength: 100
        quote:
          type: ["string", "null"]
          maxLength: 300
        note:
          type: ["string", "null"]
          maxLength: 500
    ProvenanceStringField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value: { type: ["string", "null"] }
    ProvenanceDateField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              pattern: '^\d{4}-\d{2}-\d{2}$'
    ProvenanceDocumentTypeField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [master_agreement, order_form, sow, amendment, renewal_letter, termination_notice, quote_or_proposal, unknown, null]
    ProvenanceLanguageField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [de, en, fr, it, other, null]
    ProvenanceContractTypeField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [maintenance, software_license, saas_subscription, real_estate, infrastructure, professional_services, data_services, equipment_lease, other, null]
    PeriodValue:
      type: object
      required: [amount, unit]
      properties:
        amount: { type: number, minimum: 1, multipleOf: 1 }
        unit:
          type: string
          enum: [days, weeks, months, years]
    ProvenancePeriodField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              oneOf:
                - $ref: "#/components/schemas/PeriodValue"
                - type: "null"
    ProvenanceRenewalMechanismField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [auto_renew, expires, by_mutual_agreement, indefinite, unknown, null]
    NoticePeriodValue:
      type: object
      required: [amount, unit, anchor]
      properties:
        amount: { type: number, minimum: 1, multipleOf: 1 }
        unit:
          type: string
          enum: [days, weeks, months, years]
        anchor:
          type: string
          enum: [term_end, renewal_date, anniversary, period_end_month, period_end_quarter, period_end_year, any_time, unknown]
        purpose:
          type: ["string", "null"]
          enum: [non_renewal, termination_for_convenience, other, null]
    ProvenanceNoticePeriodField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              oneOf:
                - $ref: "#/components/schemas/NoticePeriodValue"
                - type: array
                  items:
                    $ref: "#/components/schemas/NoticePeriodValue"
                - type: "null"
    NoticeDeliveryValue:
      type: object
      required: [method, address, cc]
      properties:
        method:
          type: string
          enum: [email, registered_post, post, portal, any_written]
        address: { type: ["string", "null"] }
        cc:
          type: array
          items: { type: string }
    ProvenanceNoticeDeliveryField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              oneOf:
                - $ref: "#/components/schemas/NoticeDeliveryValue"
                - type: "null"
    ContractValueValue:
      type: object
      required: [amount, currency, basis]
      properties:
        amount: { type: number, minimum: 0 }
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        basis:
          type: string
          enum: [total_contract_value, annual, monthly, per_unit, not_to_exceed, variable]
    ProvenanceContractValueField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              oneOf:
                - $ref: "#/components/schemas/ContractValueValue"
                - type: "null"
    ProvenanceBillingFrequencyField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [annual, quarterly, monthly, one_time, milestone, usage, null]
    ContractProvenance:
      type: object
      required:
        - documentType
        - documentLanguage
        - vendorLegalName
        - buyerLegalEntity
        - contractTitle
        - contractNumber
        - contractType
        - signatureDate
        - effectiveDate
        - initialTermLength
        - initialTermEndDate
        - renewalMechanism
        - renewalTermLength
        - noticePeriod
        - noticeDeadline
        - noticeDelivery
        - contractValue
        - billingFrequency
      properties:
        documentType: { $ref: "#/components/schemas/ProvenanceDocumentTypeField" }
        documentLanguage: { $ref: "#/components/schemas/ProvenanceLanguageField" }
        vendorLegalName: { $ref: "#/components/schemas/ProvenanceStringField" }
        buyerLegalEntity: { $ref: "#/components/schemas/ProvenanceStringField" }
        contractTitle: { $ref: "#/components/schemas/ProvenanceStringField" }
        contractNumber: { $ref: "#/components/schemas/ProvenanceStringField" }
        contractType: { $ref: "#/components/schemas/ProvenanceContractTypeField" }
        signatureDate: { $ref: "#/components/schemas/ProvenanceDateField" }
        effectiveDate: { $ref: "#/components/schemas/ProvenanceDateField" }
        initialTermLength: { $ref: "#/components/schemas/ProvenancePeriodField" }
        initialTermEndDate: { $ref: "#/components/schemas/ProvenanceDateField" }
        renewalMechanism: { $ref: "#/components/schemas/ProvenanceRenewalMechanismField" }
        renewalTermLength: { $ref: "#/components/schemas/ProvenancePeriodField" }
        noticePeriod: { $ref: "#/components/schemas/ProvenanceNoticePeriodField" }
        noticeDeadline: { $ref: "#/components/schemas/ProvenanceDateField" }
        noticeDelivery: { $ref: "#/components/schemas/ProvenanceNoticeDeliveryField" }
        contractValue: { $ref: "#/components/schemas/ProvenanceContractValueField" }
        billingFrequency: { $ref: "#/components/schemas/ProvenanceBillingFrequencyField" }
    ContractAssignment:
      type: object
      required: [owner, negotiationBufferDays, negotiationBufferSource, status]
      properties:
        owner: { type: string, minLength: 1 }
        negotiationBufferDays: { type: number, minimum: 0, maximum: 365, multipleOf: 1 }
        negotiationBufferSource:
          type: string
          enum: [contract_override, contract_type_default, global_default]
          description: Why this human-assigned buffer applies.
        status:
          type: string
          enum: [At Risk, Review Open, In Negotiation]
    ContractComputedStatus:
      type: string
      enum: [green, amber, red, expired, blocked]
    ContractComputedDates:
      type: object
      required: [exitDate, noticeDeadline, actionDate, status, reason]
      properties:
        exitDate: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        noticeDeadline: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        actionDate: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        status: { $ref: "#/components/schemas/ContractComputedStatus" }
        reason: { type: ["string", "null"], maxLength: 300 }
    ContractReviewRecord:
      type: object
      required: [fields, assignment, computed]
      properties:
        fields:
          $ref: "#/components/schemas/ContractProvenance"
        assignment:
          $ref: "#/components/schemas/ContractAssignment"
        computed:
          $ref: "#/components/schemas/ContractComputedDates"
    ContractExtractionResult:
      type: object
      required:
        - filename
        - extraction
      properties:
        filename:
          type: string
        extraction:
          type: object
          required:
            - contract
            - source
            - ocrConfidence
            - ocrPageCount
            - ocrPagesProcessed
          properties:
            contract:
              $ref: "#/components/schemas/ContractReviewRecord"
            source:
              type: string
              enum: [text, ocr]
              description: Whether the contract fields came from embedded PDF text or OCR.
            ocrConfidence:
              type: ["string", "null"]
              enum: [High, Medium, Low, null]
              description: OCR legibility confidence; null when embedded PDF text was used.
            ocrPageCount:
              type: ["number", "null"]
              minimum: 1
              description: Complete whole-number page count detected in the uploaded PDF; null when embedded PDF text was used.
            ocrPagesProcessed:
              type: ["number", "null"]
              minimum: 0
              description: Whole-number count of scanned PDF pages included in OCR; null when embedded PDF text was used. A successful OCR response always matches ocrPageCount.
    ContractSaveRequest:
      type: object
      required: [filename, contract]
      properties:
        filename: { type: string }
        contract:
          $ref: "#/components/schemas/ContractReviewRecord"
    SavedContract:
      allOf:
        - $ref: "#/components/schemas/ContractSaveRequest"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

