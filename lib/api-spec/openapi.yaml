openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path

security:
  - clerkSession: []
tags:
  - name: health
    description: Health operations
  - name: contracts
    description: Contract extraction and persistence operations
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /demo/contracts:
    get:
      security: []
      operationId: listDemoContracts
      tags: [contracts]
      summary: List the public read-only demonstration contracts
      responses:
        "200":
          description: Public demonstration dataset
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /registry-views:
    get:
      operationId: listRegistryViews
      tags: [contracts]
      summary: List saved registry views
      responses:
        "200":
          description: Saved registry views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedRegistryView"
    post:
      operationId: createRegistryView
      tags: [contracts]
      summary: Save a registry view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryViewSaveRequest"
      responses:
        "201":
          description: Saved registry view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedRegistryView"
        "400":
          description: Invalid registry view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registry-views/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateRegistryView
      tags: [contracts]
      summary: Rename a saved registry view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryViewSaveRequest"
      responses:
        "200":
          description: Updated registry view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedRegistryView"
        "400":
          description: Invalid registry view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Registry view not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRegistryView
      tags: [contracts]
      summary: Delete a saved registry view
      responses:
        "204":
          description: Registry view deleted
        "404":
          description: Registry view not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registry-views/{id}/pin:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: pinRegistryView
      tags: [contracts]
      summary: Pin or unpin a saved registry view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryViewPinRequest"
      responses:
        "200":
          description: Updated registry view pin state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedRegistryView"
        "400":
          description: Invalid pin state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Registry view not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /registry-views/order:
    patch:
      operationId: reorderRegistryViews
      tags: [contracts]
      summary: Reorder pinned registry views
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryViewReorderRequest"
      responses:
        "200":
          description: Registry views in their current order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedRegistryView"
        "400":
          description: Invalid pinned view order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/extract:
    post:
      operationId: extractContract
      tags: [contracts]
      summary: Extract a contract review draft from a PDF
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ContractExtractionUpload"
      responses:
        "200":
          description: Extracted contract review draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractExtractionResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unreadable PDF or extracted text exceeds the safe review limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Extraction service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/ingest-runs/current:
    get:
      operationId: getCurrentIngestRun
      tags: [contracts]
      summary: Get the latest unfinished contract ingest run
      responses:
        "200":
          description: Unfinished ingest run, or an empty response when none exists
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ContractIngestRun"
                  - type: "null"
  /contracts/ingest-runs:
    post:
      operationId: registerIngestRun
      tags: [contracts]
      summary: Persist a new resumable ingest run
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ContractIngestRegistration"
      responses:
        "201":
          description: Registered ingest run; temporary PDFs are stored in App Storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractIngestRun"
        "400":
          description: Invalid ingest run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/ingest-runs/{runId}/items/{itemId}/retry:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
      - name: itemId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryIngestItem
      tags: [contracts]
      summary: Retry a failed contract ingest item
      responses:
        "200":
          description: Extracted contract review draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractExtractionResult"
        "404":
          description: Ingest item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ingest item is not in a retryable failed state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unreadable PDF or extracted text exceeds the safe review limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Extraction service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/ingest-runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: abandonIngestRun
      tags: [contracts]
      summary: Abandon an unfinished ingest run and delete its temporary PDFs
      responses:
        "204":
          description: Ingest run abandoned
        "404":
          description: Ingest run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ingest run has an item that is actively processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/ingest-runs/{runId}/items/{itemId}/complete:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
      - name: itemId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: completeIngestItem
      tags: [contracts]
      summary: Mark a reviewed ingest item as handed off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractIngestCompletionRequest"
      responses:
        "204":
          description: Ingest item handed off
        "404":
          description: Ingest item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ingest item is not ready for handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List saved contracts
      responses:
        "200":
          description: Saved contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedContract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Save a confirmed contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractSaveRequest"
      responses:
        "201":
          description: Saved contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "400":
          description: Invalid contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getContract
      tags: [contracts]
      summary: Get a saved contract
      responses:
        "200":
          description: Saved contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateContract
      tags: [contracts]
      summary: Update a saved contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractSaveRequest"
      responses:
        "200":
          description: Updated contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "400":
          description: Invalid contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteContract
      tags: [contracts]
      summary: Permanently delete a contract after preserving its PDF in waste storage
      responses:
        "204":
          description: Contract deleted and source PDF moved to waste
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Source PDF could not be preserved in waste storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/{id}/decisions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listContractDecisions
      tags: [contracts]
      summary: List recorded decisions for a contract
      responses:
        "200":
          description: Decisions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractDecision"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: recordContractDecision
      tags: [contracts]
      summary: Record a human contract decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractDecisionRequest"
      responses:
        "201":
          description: Recorded decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractDecision"
        "400":
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/{id}/source:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getContractSource
      tags: [contracts]
      summary: Download the saved source PDF
      responses:
        "200":
          description: Source PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Contract or source PDF not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/{id}/alert/dismiss:
    post:
      operationId: dismissContractAlert
      tags: [contracts]
      summary: Dismiss a contract alert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissAlertRequest"
      responses:
        "200":
          description: Contract with dismissed alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "400":
          description: Invalid alert dismissal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/contract-waste:
    get:
      operationId: listContractWaste
      tags: [contracts]
      summary: List retained deleted contract PDFs
      responses:
        "200":
          description: Unpurged waste files, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractWasteItem"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: emptyContractWaste
      tags: [contracts]
      summary: Permanently remove every retained contract PDF
      responses:
        "200":
          description: Purge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractWastePurgeResult"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/contract-waste/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
    get:
      operationId: getContractWasteFile
      tags: [contracts]
      summary: Download a retained deleted contract PDF
      responses:
        "200":
          description: Retained source PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Waste file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: purgeContractWasteItem
      tags: [contracts]
      summary: Permanently remove one retained contract PDF
      responses:
        "204":
          description: Waste file purged or already absent
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Clerk session authentication. Browser clients authenticate with the Clerk session cookie.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - DUPLICATE
            - UNREADABLE
            - OCR_INCOMPLETE
            - TOO_LARGE
            - UNAVAILABLE
            - PDF_ENCRYPTED
            - PDF_UNREADABLE
            - PDF_REPAIR_FAILED
            - PDF_TOOL_UNAVAILABLE
            - SUPERSEDED
            - INVALID_UPLOAD
      required:
        - error
    ContractWasteItem:
      type: object
      required: [id, filename, vendorLegalName, contractTitle, contractNumber, deletedAt]
      properties:
        id: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
        filename: { type: string }
        vendorLegalName: { type: ["string", "null"] }
        contractTitle: { type: ["string", "null"] }
        contractNumber: { type: ["string", "null"] }
        deletedAt: { type: string, format: date-time }
    ContractWastePurgeResult:
      type: object
      required: [purgedCount]
      properties:
        purgedCount: { type: number, minimum: 0, multipleOf: 1 }
    RegistryViewSaveRequest:
      type: object
      required: [name, search, documentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        search:
          type: string
          maxLength: 200
        documentType:
          type: ["string", "null"]
          enum: [master_agreement, order_form, sow, amendment, renewal_letter, termination_notice, quote_or_proposal, unknown, null]
    RegistryViewPinRequest:
      type: object
      required: [pinned]
      properties:
        pinned:
          type: boolean
    RegistryViewReorderRequest:
      type: object
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
    SavedRegistryView:
      allOf:
        - $ref: "#/components/schemas/RegistryViewSaveRequest"
        - type: object
          required: [id, isPinned, createdAt, updatedAt]
          properties:
            id: { type: string }
            isPinned: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ContractExtractionUpload:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: binary
          description: One or more PDF contracts up to 10 MB each.
        ingestRunId:
          type: string
          description: Client-generated durable run identifier used to resume an unfinished batch.
        ingestItemId:
          type: string
          description: Client-generated durable item identifier within the ingest run.
    ContractIngestRegistration:
      type: object
      required: [files, runId, itemIds]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: binary
        runId:
          type: string
        itemIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
    ProvenanceMetadata:
      type: object
      required: [status, confidence, page, clause, quote, note]
      properties:
        status:
          type: string
          enum: [found, not_found, ambiguous, conflicting]
        confidence:
          type: string
          enum: [high, medium, low]
        page:
          type: ["number", "null"]
          minimum: 1
          multipleOf: 1
        clause:
          type: ["string", "null"]
          maxLength: 100
        quote:
          type: ["string", "null"]
          maxLength: 300
        note:
          type: ["string", "null"]
          maxLength: 500
        reviewed:
          type: boolean
          description: True when a human reviewer explicitly resolved this field without changing the original extraction provenance.
        originalValue:
          description: The first extracted value when a reviewer changes the field. Its shape matches the field value.
        alternatives:
          type: array
          maxItems: 5
          description: Evidence-backed competing readings when extraction status is ambiguous or conflicting.
          items:
            $ref: "#/components/schemas/ProvenanceAlternative"
    ProvenanceAlternative:
      type: object
      required: [value, page, clause, quote]
      properties:
        value:
          description: One competing reading. Its shape matches the containing field value.
        page:
          type: number
          minimum: 1
          multipleOf: 1
        clause:
          type: ["string", "null"]
          maxLength: 100
        quote:
          type: string
          minLength: 1
          maxLength: 300
    ProvenanceStringField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value: { type: ["string", "null"] }
    ProvenanceDateField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              pattern: '^\d{4}-\d{2}-\d{2}$'
    ProvenanceDocumentTypeField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [master_agreement, order_form, sow, amendment, renewal_letter, termination_notice, quote_or_proposal, unknown, null]
    ProvenanceLanguageField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [de, en, fr, it, other, null]
    ProvenanceContractTypeField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [maintenance, software_license, saas_subscription, real_estate, infrastructure, professional_services, data_services, equipment_lease, other, null]
    PeriodValue:
      type: object
      required: [amount, unit]
      properties:
        amount: { type: number, minimum: 1, multipleOf: 1 }
        unit:
          type: string
          enum: [days, weeks, months, years]
    ProvenancePeriodField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              oneOf:
                - $ref: "#/components/schemas/PeriodValue"
                - type: "null"
    ProvenanceRenewalMechanismField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [auto_renew, expires, by_mutual_agreement, indefinite, unknown, null]
    NoticePeriodValue:
      type: object
      required: [amount, unit, anchor]
      properties:
        amount: { type: number, minimum: 1, multipleOf: 1 }
        unit:
          type: string
          enum: [days, weeks, months, years, business_days]
        anchor:
          type: string
          enum: [term_end, renewal_date, anniversary, period_end_month, period_end_quarter, period_end_year, any_time, unknown]
        purpose:
          type: ["string", "null"]
          enum: [non_renewal, termination_for_convenience, other, null]
    ProvenanceNoticePeriodField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              oneOf:
                - $ref: "#/components/schemas/NoticePeriodValue"
                - type: array
                  items:
                    $ref: "#/components/schemas/NoticePeriodValue"
                - type: "null"
    NoticeDeliveryValue:
      type: object
      required: [method, address, cc]
      properties:
        method:
          type: string
          enum: [email, registered_post, post, portal, any_written]
        address: { type: ["string", "null"] }
        cc:
          type: array
          items: { type: string }
    ProvenanceNoticeDeliveryField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              oneOf:
                - $ref: "#/components/schemas/NoticeDeliveryValue"
                - type: "null"
    ContractValueValue:
      type: object
      required: [amount, currency, basis]
      properties:
        amount: { type: number, minimum: 0 }
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        basis:
          type: string
          enum: [total_contract_value, annual, monthly, per_unit, not_to_exceed, variable]
    ProvenanceContractValueField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              oneOf:
                - $ref: "#/components/schemas/ContractValueValue"
                - type: "null"
    ProvenanceBillingFrequencyField:
      allOf:
        - $ref: "#/components/schemas/ProvenanceMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: ["string", "null"]
              enum: [annual, quarterly, monthly, one_time, milestone, usage, null]
    ContractProvenance:
      type: object
      required:
        - documentType
        - documentLanguage
        - vendorLegalName
        - buyerLegalEntity
        - contractTitle
        - contractNumber
        - contractType
        - signatureDate
        - effectiveDate
        - initialTermLength
        - initialTermEndDate
        - renewalMechanism
        - renewalTermLength
        - noticePeriod
        - noticeDeadline
        - noticeDelivery
        - contractValue
        - billingFrequency
      properties:
        documentType: { $ref: "#/components/schemas/ProvenanceDocumentTypeField" }
        documentLanguage: { $ref: "#/components/schemas/ProvenanceLanguageField" }
        vendorLegalName: { $ref: "#/components/schemas/ProvenanceStringField" }
        buyerLegalEntity: { $ref: "#/components/schemas/ProvenanceStringField" }
        contractTitle: { $ref: "#/components/schemas/ProvenanceStringField" }
        contractNumber: { $ref: "#/components/schemas/ProvenanceStringField" }
        contractType: { $ref: "#/components/schemas/ProvenanceContractTypeField" }
        signatureDate: { $ref: "#/components/schemas/ProvenanceDateField" }
        effectiveDate: { $ref: "#/components/schemas/ProvenanceDateField" }
        initialTermLength: { $ref: "#/components/schemas/ProvenancePeriodField" }
        initialTermEndDate: { $ref: "#/components/schemas/ProvenanceDateField" }
        renewalMechanism: { $ref: "#/components/schemas/ProvenanceRenewalMechanismField" }
        renewalTermLength: { $ref: "#/components/schemas/ProvenancePeriodField" }
        noticePeriod: { $ref: "#/components/schemas/ProvenanceNoticePeriodField" }
        noticeDeadline: { $ref: "#/components/schemas/ProvenanceDateField" }
        noticeDelivery: { $ref: "#/components/schemas/ProvenanceNoticeDeliveryField" }
        contractValue: { $ref: "#/components/schemas/ProvenanceContractValueField" }
        billingFrequency: { $ref: "#/components/schemas/ProvenanceBillingFrequencyField" }
    ContractAssignment:
      type: object
      required: [owner, ownerEmail, negotiationBufferDays, negotiationBufferSource, status]
      properties:
        owner: { type: string, minLength: 1 }
        ownerEmail: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        negotiationBufferDays: { type: number, minimum: 0, maximum: 365, multipleOf: 1 }
        negotiationBufferSource:
          type: string
          enum: [contract_override, contract_type_default, global_default]
          description: Why this human-assigned buffer applies.
        status:
          type: string
          enum: [At Risk, Review Open, In Negotiation]
    ContractComputedStatus:
      type: string
      enum: [green, amber, red, expired, blocked]
    ContractComputedReasonCode:
      type: string
      enum:
        - CONTRACT_END_UNESTABLISHED
        - INDEFINITE_WITHOUT_FIXED_ANCHOR
        - PAST_AUTO_RENEWAL_TERM_MISSING
        - NOTICE_CLAUSE_NOT_FOUND
        - TIMING_VALUES_CONFLICT
        - NOTICE_TIMING_AMBIGUOUS
        - MULTIPLE_NOTICE_PERIODS
        - NOTICE_PERIOD_INCOMPLETE
        - NOTICE_ANCHOR_UNKNOWN
        - TIMING_EVIDENCE_UNRELIABLE
        - NOTICE_ALLOWED_ANY_TIME
        - NOTICE_ANCHOR_UNRESOLVED
        - FIXED_CONTRACT_END_PASSED
    ContractComputedDates:
      type: object
      required: [exitDate, noticeDeadline, actionDate, daysRemaining, status, reasonCode, reason]
      properties:
        exitDate: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        noticeDeadline: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        actionDate: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        daysRemaining:
          type: ["number", "null"]
          multipleOf: 1
          description: Whole calendar days until actionDate. Zero means the negotiation window opens today; negative values mean actionDate has passed.
        status: { $ref: "#/components/schemas/ContractComputedStatus" }
        reasonCode:
          oneOf:
            - $ref: "#/components/schemas/ContractComputedReasonCode"
            - type: "null"
        reason: { type: ["string", "null"], maxLength: 300 }
    ContractAlertState:
      type: string
      enum: [pending, due, overdue, dismissed]
    ContractAlert:
      type: object
      required: [owner, ownerEmail, actionDate, noticeDeadline, state, dismissedReason]
      properties:
        owner: { type: string }
        ownerEmail: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        actionDate: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        noticeDeadline: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        state: { $ref: "#/components/schemas/ContractAlertState" }
        dismissedReason: { type: ["string", "null"], maxLength: 300 }
    DismissAlertRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 300 }
    ContractReviewRecord:
      type: object
      required: [fields, assignment, computed, alert]
      properties:
        fields:
          $ref: "#/components/schemas/ContractProvenance"
        assignment:
          $ref: "#/components/schemas/ContractAssignment"
        computed:
          $ref: "#/components/schemas/ContractComputedDates"
        alert:
          oneOf:
            - $ref: "#/components/schemas/ContractAlert"
            - type: "null"
        source:
          $ref: "#/components/schemas/ContractSourceFile"
    ContractSourceFile:
      type: object
      required: [id, name, modifiedAt, size, hash]
      properties:
        id: { type: string }
        name: { type: string }
        modifiedAt: { type: ["string", "null"] }
        size: { type: number, minimum: 0, multipleOf: 1 }
        hash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ContractExtractionResult:
      type: object
      required:
        - filename
        - extraction
      properties:
        filename:
          type: string
        extraction:
          type: object
          required:
            - contract
            - source
            - ocrConfidence
            - ocrPageCount
            - ocrPagesProcessed
          properties:
            contract:
              $ref: "#/components/schemas/ContractReviewRecord"
            source:
              type: string
              enum: [text, ocr]
              description: Whether the contract fields came from embedded PDF text or OCR.
            ocrConfidence:
              type: ["string", "null"]
              enum: [High, Medium, Low, null]
              description: OCR legibility confidence; null when embedded PDF text was used.
            ocrPageCount:
              type: ["number", "null"]
              minimum: 1
              description: Complete whole-number page count detected in the uploaded PDF; null when embedded PDF text was used.
            ocrPagesProcessed:
              type: ["number", "null"]
              minimum: 0
              description: Whole-number count of scanned PDF pages included in OCR; null when embedded PDF text was used. A successful OCR response always matches ocrPageCount.
        ingestRunId:
          type: string
          description: Durable ingest run containing this extraction, when the request belongs to a resumable run.
        ingestItemId:
          type: string
          description: Durable ingest item containing this extraction, when the request belongs to a resumable run.
    ContractIngestItem:
      type: object
      required: [id, filename, state, message, extraction]
      properties:
        id: { type: string }
        filename: { type: string }
        state:
          type: string
          enum: [processing, ready, duplicate, failed]
        message:
          type: ["string", "null"]
        extraction:
          oneOf:
            - $ref: "#/components/schemas/ContractExtractionResult"
            - type: "null"
    ContractIngestRun:
      type: object
      required: [id, items]
      properties:
        id: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContractIngestItem"
    ContractIngestCompletionRequest:
      type: object
      required: [contractId]
      properties:
        contractId: { type: string, minLength: 1 }
    ContractDecisionType:
      type: string
      enum: [renew, renegotiate, cancel, snooze]
    ContractDecisionRequest:
      type: object
      required: [decision, actor]
      properties:
        decision:
          $ref: "#/components/schemas/ContractDecisionType"
        actor: { type: string, minLength: 1, maxLength: 120 }
        snoozeUntil:
          type: ["string", "null"]
          format: date
    ContractDecision:
      type: object
      required: [id, contractId, decision, actor, snoozeUntil, decidedAt]
      properties:
        id: { type: string }
        contractId: { type: string }
        decision:
          $ref: "#/components/schemas/ContractDecisionType"
        actor: { type: string }
        snoozeUntil:
          type: ["string", "null"]
          format: date
        decidedAt: { type: string, format: date-time }
    ContractSaveRequest:
      type: object
      required: [filename, contract]
      properties:
        filename: { type: string }
        contract:
          $ref: "#/components/schemas/ContractReviewRecord"
    SavedContract:
      allOf:
        - $ref: "#/components/schemas/ContractSaveRequest"
        - type: object
          required: [id, documentType, sourceAvailable, createdAt, updatedAt]
          properties:
            id: { type: string }
            documentType:
              type: ["string", "null"]
              enum: [master_agreement, order_form, sow, amendment, renewal_letter, termination_notice, quote_or_proposal, unknown, null]
            sourceAvailable: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
