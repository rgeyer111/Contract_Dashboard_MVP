openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contracts
    description: Contract extraction and persistence operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contracts/extract:
    post:
      operationId: extractContract
      tags: [contracts]
      summary: Extract a contract review draft from a PDF
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ContractExtractionUpload"
      responses:
        "200":
          description: Extracted contract review draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractExtractionResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unreadable PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Extraction service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List saved contracts
      responses:
        "200":
          description: Saved contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedContract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Save a confirmed contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractSaveRequest"
      responses:
        "201":
          description: Saved contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "400":
          description: Invalid contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contracts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getContract
      tags: [contracts]
      summary: Get a saved contract
      responses:
        "200":
          description: Saved contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateContract
      tags: [contracts]
      summary: Update a saved contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractSaveRequest"
      responses:
        "200":
          description: Updated contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedContract"
        "400":
          description: Invalid contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ContractExtractionUpload:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: A PDF contract up to 10 MB.
    ContractValue:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [stated, unknown]
        amount:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
    ContractConfidence:
      type: object
      required:
        - vendor
        - contractNumber
        - contractName
        - contractType
        - contractValue
        - startDate
        - contractDuration
        - endDate
        - noticePeriod
        - noticeDeadline
        - negotiationBuffer
        - owner
        - status
      properties:
        vendor: { type: string, enum: [High, Medium, Low] }
        contractNumber: { type: string, enum: [High, Medium, Low] }
        contractName: { type: string, enum: [High, Medium, Low] }
        contractType: { type: string, enum: [High, Medium, Low] }
        contractValue: { type: string, enum: [High, Medium, Low] }
        startDate: { type: string, enum: [High, Medium, Low] }
        contractDuration: { type: string, enum: [High, Medium, Low] }
        endDate: { type: string, enum: [High, Medium, Low] }
        noticePeriod: { type: string, enum: [High, Medium, Low] }
        noticeDeadline: { type: string, enum: [High, Medium, Low] }
        negotiationBuffer: { type: string, enum: [High, Medium, Low] }
        owner: { type: string, enum: [High, Medium, Low] }
        status: { type: string, enum: [High, Medium, Low] }
    ContractReviewDraft:
      type: object
      required:
        - vendor
        - contractNumber
        - contractName
        - contractType
        - contractValue
        - startDate
        - contractDuration
        - endDate
        - noticePeriod
        - noticeDeadline
        - negotiationBuffer
        - owner
        - status
      properties:
        vendor: { type: string }
        contractNumber: { type: string }
        contractName: { type: string }
        contractType:
          type: string
          enum: ["", Maintenance, Software License, Real Estate, Infrastructure]
        contractValue:
          $ref: "#/components/schemas/ContractValue"
        startDate: { type: string }
        contractDuration: { type: string }
        endDate: { type: string }
        noticePeriod: { type: string }
        noticeDeadline: { type: string }
        negotiationBuffer: { type: string }
        owner: { type: string }
        status:
          type: string
          enum: [At Risk, Review Open, In Negotiation]
    ContractExtractionResult:
      type: object
      required:
        - filename
        - extraction
      properties:
        filename:
          type: string
        extraction:
          type: object
          required:
            - contract
            - confidence
          properties:
            contract:
              $ref: "#/components/schemas/ContractReviewDraft"
            confidence:
              $ref: "#/components/schemas/ContractConfidence"
    ContractSaveRequest:
      type: object
      required: [filename, contract, confidence]
      properties:
        filename: { type: string }
        contract:
          $ref: "#/components/schemas/ContractReviewDraft"
        confidence:
          $ref: "#/components/schemas/ContractConfidence"
    SavedContract:
      allOf:
        - $ref: "#/components/schemas/ContractSaveRequest"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

